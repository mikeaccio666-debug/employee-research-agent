# The checks every pull request must pass before it merges: types, unit tests and a
# production build. It also runs on every push to the production branch, so a broken
# merge shows up even if a check was skipped.
#
# The build runs without Supabase settings, so the app builds on the canvas fixtures and
# the job needs no secrets (Dependabot pull requests and forks run it too).
#
# The job is named `check` so a branch ruleset can require it by that name.
# Agent evals live in agent-evals.yml and only run when the agent's code changes.

name: CI

on:
  pull_request:
  push:
    branches: [main, claude/kind-mayer-r65sp4]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: 1
      TURBO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Production build
        run: pnpm build
